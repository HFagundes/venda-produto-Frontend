<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Vendas</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<header>
    <h1>Sistema de Vendas</h1>
</header>

<main>

    <section class="acoes">

        <button id="btnConexao">
            Testar conexão
        </button>

        <button id="btnVendas">
            Listar vendas
        </button>

    </section>


    <p id="mensagem"></p>



    <!-- Essa section começa vazia mas será preenchida com os cards das 
    vendas quando o usuário clicar no botão "Listar vendas" (As informações das vendas vão vir do backend) -->
    <section>

        <h2>Vendas</h2>

        <div id="vendas">

            <p class="mensagem-inicial">
                Clique em "Listar vendas" para carregar os dados.
            </p>

        </div>

    </section>

</main>


<script src="script.js"></script>


</body>

</html>
